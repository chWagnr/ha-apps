name: Update add-on changelogs

on:
  push:
    branches:
      - main
    paths:
      - "certflow/config.yaml"
      - "papra/config.yaml"
      - "tandoor-mcp/config.yaml"
      - "nextcloud-mcp/config.yaml"
      - ".github/workflows/update-addon-changelogs.yaml"
      - ".github/scripts/generate-addon-changelogs.sh"
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: addon-changelog-${{ github.ref }}
  cancel-in-progress: false

jobs:
  changelog:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
          ref: main

      - name: Create missing changelog entries
        run: bash .github/scripts/generate-addon-changelogs.sh

      - name: Validate release notes
        env:
          BASE_SHA: ""
          EVENT_NAME: ${{ github.event_name }}
        run: |
          python3 - <<'PY'
          import os
          import re
          import subprocess
          from pathlib import Path

          base = os.environ.get('BASE_SHA', '')
          check_all = os.environ['EVENT_NAME'] == 'workflow_dispatch' or not base or set(base) == {'0'}
          failed = False
          for addon in ('certflow', 'papra', 'tandoor-mcp', 'nextcloud-mcp'):
              config = Path(addon, 'config.yaml')
              match = re.search(r'^version:\s*"([^"\n]+)"\s*$', config.read_text(), re.MULTILINE)
              if not match:
                  print(f'::error file={config}::Cannot read add-on version.')
                  failed = True
                  continue
              version = match[1]
              changelog = Path(addon, 'CHANGELOG.md')
              if not check_all:
                  previous = subprocess.run(['git', 'show', f'{base}:{config}'], capture_output=True, text=True)
                  previous_version = re.search(r'^version:\s*"([^"\n]+)"\s*$', previous.stdout, re.MULTILINE)
                  notes_changed = subprocess.run(['git', 'diff', '--quiet', base, 'HEAD', '--', str(changelog)], check=False)
                  if notes_changed.returncode not in (0, 1):
                      raise SystemExit('Cannot compare changelog against base commit.')
                  if previous_version and previous_version[1] == version and notes_changed.returncode == 0:
                      print(f'{addon}: version and release notes unchanged; skipping.')
                      continue
              if not changelog.is_file():
                  print(f'::error file={changelog}::Missing release notes for {version}.')
                  failed = True
                  continue
              text = changelog.read_text()
              headings = list(re.finditer(r'^##\s+\[([^\]\n]+)\][^\n]*$', text, re.MULTILINE))
              entries = [i for i, heading in enumerate(headings) if heading[1] == version]
              if len(entries) != 1:
                  print(f'::error file={changelog}::Expected exactly one entry for {version}; found {len(entries)}.')
                  failed = True
                  continue
              index = entries[0]
              start = headings[index].end()
              end = headings[index + 1].start() if index + 1 < len(headings) else len(text)
              lines = [line.strip() for line in text[start:end].splitlines()]
              meaningful = [line for line in lines if line and not line.startswith('#')
                            and line not in ('- Versionsupdate und Wartung.', '- TODO', 'TODO', '- TBD', 'TBD')]
              if not meaningful:
                  print(f'::error file={changelog}::Add meaningful release notes for {version}; headings and placeholders are insufficient.')
                  failed = True
                  continue
              print(f'{addon}: release notes for {version} valid.')
          raise SystemExit(1 if failed else 0)
          PY

      - name: Create changelog pull request
        id: changelog-pr
        uses: peter-evans/create-pull-request@v8
        with:
          base: main
          add-paths: |
            certflow/CHANGELOG.md
            papra/CHANGELOG.md
            tandoor-mcp/CHANGELOG.md
            nextcloud-mcp/CHANGELOG.md
          branch: automation/addon-changelog
          delete-branch: true
          sign-commits: true
          commit-message: "docs: update add-on changelogs"
          title: "docs: update add-on changelogs"
          body: "Generated automatically from changes to app versions."

      - name: Merge changelog pull request
        if: steps.changelog-pr.outputs.pull-request-number != ''
        env:
          GH_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ steps.changelog-pr.outputs.pull-request-number }}
        run: |
          set -euo pipefail

          merge_state="$(gh pr view "${PR_NUMBER}" --json mergeStateStatus --jq '.mergeStateStatus')"
          if [ "${merge_state}" = "CLEAN" ]; then
            gh pr merge "${PR_NUMBER}" --squash --delete-branch
          else
            gh pr merge "${PR_NUMBER}" --auto --squash --delete-branch
          fi
